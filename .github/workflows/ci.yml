name: Mobile checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: Backend branch, tag, or commit to compare
        default: 616730a7e4d09d4839c32b8317b6a39748a35ad8
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Africa/Johannesburg]
    env:
      TZ: ${{ matrix.timezone }}

    steps:
      # Download the mobile repository.
      - uses: actions/checkout@v4.2.2

      # Install the Flutter version used by this project.
      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Install the exact dependency versions in the lockfile.
      - run: flutter pub get --enforce-lockfile

      # Regenerate the API client using the committed OpenAPI snapshot.
      - name: Recreate the API client from the committed contract
        run: |
          rm -rf lib/core/data/generated
          dart run swagger_parser
          dart format lib/core/data/generated

      # Check formatting across application and test code.
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      # Regenerate Riverpod and other generated Dart files.
      - run: dart run build_runner build

      # Fail if generated files differ from committed versions.
      - name: Check committed generated files
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      # Check for static-analysis errors.
      - run: dart analyze --fatal-infos

      # Run automated tests without requiring a live backend.
      - run: flutter test --coverage --exclude-tags live
      - run: dart run tool/check_coverage.dart
      - name: Upload golden failure images
        if: failure() && matrix.timezone == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  android-integration:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json
            flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json
            flutter test integration_test --flavor dev --dart-define-from-file=config/dev.json
            flutter drive --debug -d emulator-5554 --flavor dev --dart-define-from-file=config/dev.json --dart-define=CAPTURE_ANDROID_SCREENSHOT=true --driver=integration_test/screenshot_driver.dart --target=integration_test/contribution_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-12.1-android
          path: assignment-12.1-contribution.png
          if-no-files-found: error

  backend-contract:
    runs-on: ubuntu-latest

    steps:
      # Download the mobile repository.
      - uses: actions/checkout@v4.2.2

      # Compare against the backend revision recorded in the contract notes.
      - uses: actions/checkout@v4.2.2
        with:
          repository: Damian-Salley/RondiTrack
          ref: ${{ inputs.api_ref || '616730a7e4d09d4839c32b8317b6a39748a35ad8' }}
          path: backend
          persist-credentials: false

      # Fail if the mobile snapshot differs from the backend contract.
      - name: Check backend contract drift
        run: cmp contract/openapi/v1.json backend/openapi/v1.json
