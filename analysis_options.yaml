include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # This private application has no published Dart API to document.
    public_member_api_docs: false
